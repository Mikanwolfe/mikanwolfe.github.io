<script>
  /* 
  Navbar scrolling highlighter
   Re-engineered by Mikanwolfe, who doesn't know JavaScript

  Original navbar highlighter depended on static values for the showcase hero heights.
   This doesn't really work well if the divs are chock-a-block full at lower aspect ratios
   The event handler below checks the height of each hero section and adjusts accordingly.
  
  */
  var navItems = document.getElementsByClassName('navbar-item');
  var heroes = document.getElementsByClassName('hero');
  var magicScrollNumber = 200; 

  window.addEventListener("scroll", function (event) {
    var scroll = this.scrollY;
    var position = window.pageYOffset;

    for (var i = 0; i < navItems.length; i++) {
      navItems[i].classList.remove('is-active');
    }

    for (var i = 0; i < heroes.length; i++) {
        var sectionTop = heroes[i].offsetTop-magicScrollNumber;
        var sectionBottom = heroes[i].offsetTop + heroes[i].offsetHeight-magicScrollNumber;

        if (scroll >= sectionTop && scroll < sectionBottom) {
          navItems[i+1].classList.add('is-active');
      }
    }
  });
</script>
