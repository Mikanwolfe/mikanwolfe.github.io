<section class="hero is-fullheight has-text-centered has-background-white-ter" id="projects">
    <div class="hero-body">
        <div class="container has-text-centered">
            <p class="subtitle is-uppercase">nekox projects</p>
            <hr class="has-background-black">
            This site is an ongoing project! The following is a work in progress.
            <br> Currently rethinking the navbar.
            <div class="section">
                {% for project in site.data.projects %}
                <div class="column has-text-centered is-paddingless is-marginless is-one-third-widescreen is-one-third-desktop is-one-fifth-fullhd is-one-third-tablet is-two-fifths-mobile is-three-quarters-touch"
                    id="project-card">
                    <a href="{{project.link}}" target="_blank">
                    <div class="has-background-black card">
                        <figure class="image is-3by1" style="background-image: url({{project.image}});">
                        </figure>
                        <div class="card-content">
                        <h1 class="title has-text-white is-size-4">{{ project.name }}</h1>
                        <p class="has-text-white has-text-weight-light content">{{ project.description | truncate: 80}}</p>
                        </div>
                    </div>
                    </a>
                </div>
                {% endfor %}
            </div>
            <br>
            <a href="{{site.url}}{{site.baseurl}}/#contact"
            class="button is-rounded is-outlined is-uppercase has-text-weight-normal is-black">Interested?</a>
            </a>
        </div>        
    </div>
    {% include down-button.html link="#contact" %}
</section>
